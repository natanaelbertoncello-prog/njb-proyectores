name: proyectar
description: "NJB Proyectores: espejado de pantalla por Wi-Fi desde PC o celular hacia un proyector Android."
publish_to: 'none'

# Formato: MAYOR.MENOR.PARCHE+BUILD
# El script tools/publicar.ps1 incrementa este número y crea el tag vX.Y.Z
# que dispara la compilación y publicación automática en GitHub.
version: 1.1.12+14

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.6.1

  # Captura, transmisión y descubrimiento
  flutter_webrtc: ^0.12.1
  bonsoir: ^6.0.0

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # Red y señalización
  shelf: ^1.4.1
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.1
  network_info_plus: ^6.1.1
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  http: ^1.3.0

  # Actualización automática
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.0
  window_manager: ^0.4.3
  shared_preferences: ^2.3.0

  # Navegador integrado del receptor (proyectar una página web sin espejar)
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
